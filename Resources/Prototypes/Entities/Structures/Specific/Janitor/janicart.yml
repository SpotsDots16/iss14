# Mop Bucket
- type: entity
  parent: [SolutionGinormous, SolutionTank, BaseStructureDynamic, StructureWheeled]
  id: MopBucket
  name: mop bucket
  description: Holds water and the tears of the janitor.
  components:
  - type: Clickable
  - type: Sprite
    sprite: Objects/Specific/Janitorial/janitorial.rsi
    noRot: true
    layers:
    - state: mopbucket
    - state: mopbucket_water-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    drawdepth: Objects
  - type: InteractionOutline
  - type: Spillable
    solution: tank
    spillDelay: 3.0
    spillWhenThrown: false
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: ItemMapper
    mapLayers:
      mopbucket_shark_blue:
        whitelist:
          tags:
            - PlushieSharkBlue
      mopbucket_shark_pink:
        whitelist:
          tags:
            - PlushieSharkPink
      mopbucket_shark_grey:
        whitelist:
          tags:
            - PlushieSharkGrey
      mopbucket_carpplush:
        whitelist:
          tags:
            - PlushieCarp
      mopbucket_magicarpplush:
        whitelist:
          tags:
          - PlushieCarpMagi
      mopbucket_holocarpplush:
        whitelist:
          tags:
          - PlushieCarpHolo
    sprite: Objects/Specific/Janitorial/janitorial.rsi
  - type: Transform
    noRot: true
  - type: ItemSlots
    slots:
      item_slot:
        name: mop-bucket-slot-component-slot-name-item
        ejectVerbText: mop-bucket-slot-component-eject-verb
        whitelist:
          tags:
            - PlushieSharkBlue
            - PlushieSharkPink
            - PlushieSharkGrey
            - PlushieCarp
            - PlushieCarpHolo
            - PlushieCarpMagi
          components:
            - Rehydratable
        priority: 3 # Higher than drinking priority
  - type: ReactiveContainer
    solution: tank
    container: item_slot
  - type: Edible
    edible: Drink
    solution: tank
    destroyOnEmpty: false
    utensil: Spoon
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: mopbucket_water-
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      item_slot: !type:ContainerSlot {}
  - type: GuideHelp
    guides:
    - Janitorial
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 70
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DnaSubstanceTrace
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask

- type: entity
  name: mop bucket
  id: MopBucketFull
  parent: MopBucket
  suffix: full
  components:
  - type: Sprite
    layers:
      - state: mopbucket
      - state: mopbucket_water-3
        map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 960

- type: entity
  parent: BaseWrappedCube
  name: mop bucket cube
  id: MopBucketCubeWrapped
  description: Unwrap this to get a mop bucket cube.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MopBucketCube
  - type: Sprite
    state: wrapper

# Janicart
- type: entity
  parent: [SolutionGinormous, SolutionTank, BaseStructureDynamic, StructureWheeled]
  id: JanitorialTrolley
  name: janitorial trolley
  description: This is the alpha and omega of sanitation.
  components:
  - type: Sprite
    noRot: true
    sprite: Objects/Specific/Janitorial/janitorial_cart.rsi
    layers:
    - state: cart
    - state: cart_water-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Rotatable
  - type: InteractionOutline
    # Direct click insertion is disabled to preserve solution interactions.
  - type: Storage
    grid:
    - 0,0,9,7
    maxItemSize: Large
    clickInsert: false
    whitelist:
      tags:
      - Mop
      - Plunger
      - GoldenPlunger
      - WetFloorSign
      - LightReplacer
      - Spray
      - Bucket
      - TrashBag
      - TrashBagBlue
      - Soap
      - WireBrush
      - HolosignProjector
      - CleanerGrenade
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 250
        layer:
        - MobLayer
        mask:
        - MobMask
  - type: Spillable
    solution: tank
    spillDelay: 3.0
    spillWhenThrown: false
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 960
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ItemMapper
    mapLayers:
      cart_plunger:
        whitelist:
          tags:
          - Plunger
      cart_goldenplunger:
        whitelist:
          tags:
          - GoldenPlunger
      cart_mop:
        whitelist:
          tags:
          - MopBasic
      cart_advmop:
        whitelist:
          tags:
          - MopAdv
      cart_garbage:
        whitelist:
          tags:
          - TrashBag
      cart_garbage_blue:
        whitelist:
          tags:
          - TrashBagBlue
      cart_replacer:
        whitelist:
          components:
          - LightReplacer
      cart_spray:
        whitelist:
          tags:
          - Spray
      cart_sign1: # this is like stack of floor signs
        minCount: 1
        whitelist:
          tags:
          - WetFloorSign
      cart_sign2:
        minCount: 2
        whitelist:
          tags:
          - WetFloorSign
      cart_sign3:
        minCount: 3
        whitelist:
          tags:
          - WetFloorSign
      cart_sign4:
        minCount: 4
        whitelist:
          tags:
          - WetFloorSign
      cart_bucket:
        whitelist:
          tags:
          - Bucket
    sprite: Objects/Specific/Janitorial/janitorial_cart.rsi
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: cart_water-
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Edible
    edible: Drink
    solution: tank
    destroyOnEmpty: false
    utensil: Spoon
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: GuideHelp
    guides:
    - Janitorial
  - type: DnaSubstanceTrace
