# iss14: Tajaran species ported from Carpmosia and translated from their organ-based
# (Nubody) format to this fork's classic species format (Shitmed part-based body).
# Structure mirrors Species/vulpkanin.yml; stats and assets come from Carpmosia.

- type: species
  id: Tajaran
  name: species-name-tajaran
  roundStart: true
  prototype: MobTajaran
  sprites: MobTajaranSprites
  defaultSkinTone: "#5a3f2d"
  markingLimits: MobTajaranMarkingLimits
  dollPrototype: MobTajaranDummy
  skinColoration: Hues # iss14: was VulpkaninColors (skinColoration prototype); this fork only has the HumanoidSkinColor enum
  maleFirstNames: NamesTajaran
  femaleFirstNames: NamesTajaran
  naming: FirstFirst

- type: speciesBaseSprites
  id: MobTajaranSprites
  sprites:
    Head: MobTajaranHead
    Face: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Underwear: MobHumanoidAnyMarking
    Undershirt: MobHumanoidAnyMarking
    Chest: MobTajaranTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobTajaranEyes
    LArm: MobTajaranLArm
    RArm: MobTajaranRArm
    LHand: MobTajaranLHand
    RHand: MobTajaranRHand
    LLeg: MobTajaranLLeg
    RLeg: MobTajaranRLeg
    LFoot: MobTajaranLFoot
    RFoot: MobTajaranRFoot

- type: markingPoints
  id: MobTajaranMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ CatTailBasic ]
    Head:
      points: 3
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ CatEarsBasic ]
    Chest:
      points: 2
      required: false
    Undershirt:
      points: 1
      required: false
    Underwear:
      points: 1
      required: false
    Arms:
      points: 6
      required: false
    Legs:
      points: 6
      required: false

# iss14: Tajaran parts.rsi has no dedicated eyes state; use the shared customization eyes.
- type: humanoidBaseSprite
  id: MobTajaranEyes
  baseSprite:
    sprite: Mobs/Customization/eyes.rsi
    state: eyes

