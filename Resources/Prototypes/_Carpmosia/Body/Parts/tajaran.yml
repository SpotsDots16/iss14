# iss14: Tajaran body parts for the part-based (Shitmed) body system, mirroring Vulpkanin.
- type: entity
  id: PartTajaran
  parent: [BaseItem, BasePart]
  name: "tajaran body part"
  abstract: true
  components:
  - type: Icon
    sprite: _Carpmosia/Mobs/Species/Tajaran/parts.rsi
  - type: BodyPart
    species: Tajaran
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: ChestTajaran
  name: "tajaran chest"
  parent: [PartTajaran, BaseChest]
  components:
  - type: Sprite
    sprite: _Carpmosia/Mobs/Species/Tajaran/parts.rsi
    state: "torso_m"
  - type: Icon # iss14: tajaran parts.rsi has no chest_m state (BaseChest default), it uses torso_m
    sprite: _Carpmosia/Mobs/Species/Tajaran/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: GroinTajaran
  name: "tajaran groin"
  parent: [PartTajaran, BaseGroin]
  components:
  - type: Sprite # tajaran parts.rsi has no separate groin state, reuse the human one
    sprite: Mobs/Species/Human/parts.rsi
    state: "groin_m"
  - type: Icon # iss14: same as Sprite - tajaran parts.rsi has no groin state
    sprite: Mobs/Species/Human/parts.rsi
    state: "groin_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadTajaran
  name: "tajaran head"
  parent: [PartTajaran, BaseHead]
  components:
  - type: Sprite
    sprite: _Carpmosia/Mobs/Species/Tajaran/parts.rsi
    state: "head_m"
  - type: Icon
    sprite: _Carpmosia/Mobs/Species/Tajaran/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

