# Ported from Trauma-Station.

- type: entity
  parent: BaseGameRule
  id: Insurgency
  components:
  - type: GameRule
    minPlayers: 5
    # iss14: Insurgency rides along with the Secret preset; below the player minimum it must
    # quietly skip instead of cancelling the whole preset (which sent round start into the
    # 30 second delayed-restart fallback loop on low pop).
    cancelPresetOnTooFewPlayers: false
  - type: NestedRule
    rules: !type:GroupSelector
      children:
      - id: InsurgencyShipVariantTide
        weight: 30
      - id: InsurgencyShipVariantInsurgents
        weight: 70

- type: entity
  abstract: true
  parent: BaseRoundstartAntagRule
  id: BaseInsurgencyRule
  components:
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/insurgents.yml
  - type: AntagObjectives
    objectives:
    - InsurgentEscapeObjective
    #- InsurgentAllSurviveObjective # TODO
  # Trauma blacklists Plasmaman here (forced to Human); this fork has no such species, so the
  # rule just loads the player's own character profile.
  - type: AntagLoadProfileRule
  - type: InsurgencyRule
  - type: AntagSelection
    agentName: insurgent-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: Insurgent
      range:
        min: 1
        max: 4
      playerRatio: 10

- type: entity
  parent: BaseInsurgencyRule
  id: InsurgencyShipVariantInsurgents
  components:
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/insurgents.yml

- type: entity
  parent: BaseInsurgencyRule
  id: InsurgencyShipVariantTide
  components:
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/tide_insurgents.yml
