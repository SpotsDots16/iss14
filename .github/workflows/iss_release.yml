name: ISS14 Build and Deploy

on:
  push:
    branches:
      - 'release/**'

# FIX: these were nested under `on:` (invalid). They belong in a top-level env block.
env:
  SSH_USER: iss14
  SSH_HOST: lemonsquizy.com
  SSH_PORT: "18281"
  DEPLOY_PATH: /home/iss14
  ZIP_NAME: SS14.Server_linux-x64.zip

# Prevent two deploys from running at once and stomping on each other.
concurrency:
  group: iss14-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # The RobustToolbox engine version actually built into this release; the deploy
      # job embeds it into the live server_config.toml (build.engine_version).
      engine_version: ${{ steps.engine_version.outputs.engine_version }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 9.0.x

      - name: Get Engine Tag
        run: |
          cd RobustToolbox
          # --tags added: a plain --depth=1 fetch does NOT pull tags.
          git fetch --depth=1 --tags

      # build.engine_version must exactly match the engine compiled into the server,
      # so read it from the checked-out submodule rather than hardcoding it anywhere.
      - name: Determine Engine Version
        id: engine_version
        run: |
          ENGINE_VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' RobustToolbox/MSBuild/Robust.Engine.Version.props)"
          if [ -z "$ENGINE_VERSION" ]; then
            echo "Failed to parse engine version from Robust.Engine.Version.props" >&2
            exit 1
          fi
          echo "engine_version=$ENGINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Engine version: $ENGINE_VERSION"

      - name: Install dependencies
        run: dotnet restore

      - name: Build Packaging Tool
        run: dotnet build Content.Packaging --configuration Release

      - name: Package Server
        run: dotnet run --project Content.Packaging server --hybrid-acz --platform linux-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: release/SS14.Server_linux-x64.zip
          if-no-files-found: error

      # Built as a side effect of --hybrid-acz. Hosted on dl.lemonsquizy.com so
      # replay content bundles (replay.make_content_bundle) have a stable download URL.
      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-zip
          path: release/SS14.Client.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      ENGINE_VERSION: ${{ needs.build.outputs.engine_version }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-zip
          path: ./downloaded-artifact

      - name: Download Client Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-zip
          path: ./downloaded-client

      - name: Determine version and client hash
        run: |
          # Workflow triggers on release/** only, so GITHUB_REF_NAME is "release/<version>".
          VERSION="${GITHUB_REF_NAME#release/}"
          # build.hash must be the uppercase SHA-256 of the exact zip the launcher downloads.
          CLIENT_HASH="$(sha256sum ./downloaded-client/SS14.Client.zip | awk '{print toupper($1)}')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CLIENT_HASH=$CLIENT_HASH" >> "$GITHUB_ENV"
          echo "Version: $VERSION, client hash: $CLIENT_HASH"

      - name: Create SSH key file
        env:
          SSH_KEY_ED25519: ${{ secrets.SSH_KEY_ED25519 }}
        run: |
          echo "$SSH_KEY_ED25519" > ssh_key
          chmod 600 ssh_key

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Pins the host key so we can drop StrictHostKeyChecking=no (MITM protection).
          # For stronger guarantees, store the known_hosts line as a secret instead of
          # scanning it fresh each run.
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Stop GetIn service (if running)
        run: |
          ssh -p "$SSH_PORT" -i ssh_key "$SSH_USER@$SSH_HOST" '
            if sudo systemctl is-active --quiet getin; then
              sudo systemctl stop getin
              echo "GetIn was running. Stopped GetIn."
            else
              echo "GetIn is not running."
            fi
          '

      - name: Prepare Deployment (Stop & Backup)
        run: |
          ssh -p "$SSH_PORT" -i ssh_key "$SSH_USER@$SSH_HOST" "$DEPLOY_PATH/tools/prepare_deploy.sh"

      - name: Copy Zip to Server
        run: |
          scp -P "$SSH_PORT" -i ssh_key \
            "./downloaded-artifact/$ZIP_NAME" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/server/"

      # nginx (dl.lemonsquizy.com) serves root /home/iss14/client, so this lands at
      # https://dl.lemonsquizy.com/<version>/SS14.Client.zip — matching
      # build.download_url = "https://dl.lemonsquizy.com/{FORK_VERSION}/SS14.Client.zip".
      # Must happen before the server restarts with the new version/hash.
      - name: Publish Client Zip for Launcher
        run: |
          ssh -p "$SSH_PORT" -i ssh_key "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/client/$VERSION'"
          scp -P "$SSH_PORT" -i ssh_key \
            ./downloaded-client/SS14.Client.zip \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/client/$VERSION/"

      - name: Finalize Deployment (Unzip, Restore & Start)
        run: |
          echo "Deploying version: $VERSION (engine $ENGINE_VERSION)"
          # finalize_deploy.sh writes version, client hash and engine_version into the
          # live server_config.toml before starting the server.
          ssh -p "$SSH_PORT" -i ssh_key "$SSH_USER@$SSH_HOST" \
            "$DEPLOY_PATH/tools/finalize_deploy.sh '$VERSION' '$CLIENT_HASH' '$ENGINE_VERSION'"